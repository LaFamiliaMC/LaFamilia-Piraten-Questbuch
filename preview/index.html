const assetRoot='../src/main/resources/assets/lafamilia_questbook/';

function p(id){return img[id]}

 ctx.fillStyle=color;ctx.font=font;const words=s.split(/\s+/);let ln='',i=0;
 for(const w of words){const n=ln?ln+' '+w:w;if(ctx.measureText(n).width>maxWidth&&ln){ctx.fillText(ln,x,y+i*step);i++;if(i>=rows)return;ln=w;}else ln=n;}
 if(ln&&i<rows)ctx.fillText(ln,x,y+i*step);
}
